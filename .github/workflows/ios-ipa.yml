# Release pipeline: every push to main (= every merged PR) builds an UNSIGNED Frame Remote .ipa
# on a GitHub macOS runner and publishes it as a GitHub Release together with an AltStore source.
# AltStore re-signs the app with your free Apple ID when it installs the update.
#
# Add this source to AltStore once (Sources → +):
#   https://github.com/RitualKit/Tv-remote/releases/latest/download/source.json
#
# Version: 1.2.<run number>, build <run number> — strictly increasing, which is what AltStore
# compares to offer updates. Docs/test-only pushes don't release. Can also be run by hand
# (Actions → "Release to AltStore" → Run workflow). The repo is public, so runner minutes are free.
name: Release to AltStore

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**', 'test/**', '.github/workflows/checks.yml']
  workflow_dispatch:

# One release at a time; a newer push supersedes a running one.
concurrency:
  group: release
  cancel-in-progress: true

permissions:
  contents: read

env:
  APP_VERSION: 1.2.${{ github.run_number }}
  APP_BUILD: ${{ github.run_number }}

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  ipa:
    needs: checks
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      CI: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Select newest Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode*.app | sort -V | tail -n1)
          sudo xcode-select -s "$XCODE"
          xcodebuild -version
          echo "node $(node -v) · building $APP_VERSION ($APP_BUILD)"

      - run: npm ci

      - name: Generate iOS project (expo prebuild)
        run: npx expo prebuild --platform ios --clean --no-install

      - name: Cache CocoaPods downloads
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/CocoaPods
          key: pods-${{ runner.os }}-${{ hashFiles('package-lock.json', 'modules/**/*.podspec') }}
          restore-keys: pods-${{ runner.os }}-

      - name: pod install
        working-directory: ios
        run: pod install

      - name: Build Release (unsigned)
        run: |
          mkdir -p build
          WORKSPACE=$(ls -d ios/*.xcworkspace | head -n1)
          SCHEME=$(basename "$WORKSPACE" .xcworkspace)
          echo "workspace=$WORKSPACE scheme=$SCHEME"
          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            build > build/xcodebuild.log 2>&1 || {
              echo "::error::xcodebuild failed — first errors:"
              grep -n "error:" build/xcodebuild.log | head -40
              tail -80 build/xcodebuild.log
              exit 1
            }
          tail -5 build/xcodebuild.log

      - name: Package .ipa and read its Info.plist
        run: |
          APP=$(find build/DerivedData/Build/Products -maxdepth 2 -name '*.app' -type d | head -n1)
          echo "app=$APP"
          if [ ! -f "$APP/main.jsbundle" ]; then
            echo "::error::Release build has no embedded JS bundle"; exit 1
          fi
          plutil -convert json -o build/info.json "$APP/Info.plist"
          # The AltStore source must describe exactly this binary: same version, build and usage
          # descriptions (AltStore checks declared permissions against the app).
          node -e '
            const fs = require("fs");
            const info = JSON.parse(fs.readFileSync("build/info.json", "utf8"));
            const want = { CFBundleShortVersionString: process.env.APP_VERSION, CFBundleVersion: process.env.APP_BUILD };
            for (const [k, v] of Object.entries(want)) {
              if (info[k] !== v) { console.error(`::error::${k} is ${info[k]}, expected ${v}`); process.exit(1); }
            }
            const privacy = Object.fromEntries(Object.entries(info).filter(([k]) => /^NS\w+UsageDescription$/.test(k)));
            fs.writeFileSync("build/privacy.json", JSON.stringify(privacy, null, 2));
            console.log("privacy keys:", Object.keys(privacy).join(", ") || "(none)");
          '
          mkdir -p build/Payload
          cp -R "$APP" build/Payload/
          (cd build && zip -qry FrameRemote.ipa Payload)
          ls -lh build/FrameRemote.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: FrameRemote-ipa
          path: |
            build/FrameRemote.ipa
            build/privacy.json
          retention-days: 30
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: xcodebuild-log
          path: build/xcodebuild.log
          retention-days: 7

  publish:
    needs: ipa
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # create the release; nothing else
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/download-artifact@v4
        with:
          name: FrameRemote-ipa
          path: build

      - name: Build AltStore source
        run: |
          node tools/make-altstore-source.mjs \
            --version "$APP_VERSION" --build "$APP_BUILD" \
            --ipa build/FrameRemote.ipa --privacy build/privacy.json \
            --repo "$REPO" --notes "$(git log -1 --pretty=%s)" --out build/source.json

      - name: Create GitHub Release
        run: |
          TAG="v$APP_VERSION"
          # A re-run of the same workflow run reuses the version: replace that release.
          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$TAG" build/FrameRemote.ipa build/source.json \
            --target "$GITHUB_SHA" --latest \
            --title "Frame Remote $APP_VERSION" \
            --notes "$(git log -1 --pretty=%B)"

      - name: Keep only the newest 5 releases
        run: |
          gh release list --limit 100 --json tagName,createdAt \
            --jq 'sort_by(.createdAt) | reverse | .[5:] | .[].tagName' |
          while read -r tag; do
            echo "deleting old release $tag"
            gh release delete "$tag" --yes --cleanup-tag
          done

      - name: Check the public source URL
        run: |
          URL="https://github.com/$REPO/releases/latest/download/source.json"
          GOT=$(curl -fsSL "$URL" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>console.log(JSON.parse(s).apps[0].versions[0].version))') || GOT=""
          if [ "$GOT" = "$APP_VERSION" ]; then
            echo "AltStore source is live: $URL → $GOT"
          else
            echo "::warning::$URL returned '$GOT', expected $APP_VERSION. Is the repository public?"
          fi
