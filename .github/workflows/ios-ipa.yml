# Builds an UNSIGNED iOS .ipa of Frame Remote on a GitHub macOS runner (no Mac or paid Apple
# account needed). AltStore re-signs it with your Apple ID when you install it on the iPhone.
#
# Run it: GitHub → Actions → "iOS IPA (for AltStore)" → Run workflow. Pushing a tag v* also builds.
# Download the "FrameRemote-ipa" artifact from the run page and unzip it to get FrameRemote.ipa.
#
# Cost: this repo is private, so macOS minutes count 10x against the free 2,000/month
# (~200 macOS minutes ≈ 8 builds). The cheap Linux "checks" job runs first so a broken commit
# never reaches the macOS job.
name: iOS IPA (for AltStore)

on:
  workflow_dispatch:
  push:
    tags: ['v*']

concurrency:
  group: ios-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  ipa:
    needs: checks
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      CI: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Select newest Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode*.app | sort -V | tail -n1)
          sudo xcode-select -s "$XCODE"
          xcodebuild -version
          echo "node $(node -v)"

      - run: npm ci

      - name: Generate iOS project (expo prebuild)
        run: npx expo prebuild --platform ios --clean --no-install

      - name: Cache CocoaPods downloads
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/CocoaPods
          key: pods-${{ runner.os }}-${{ hashFiles('package-lock.json', 'modules/**/*.podspec') }}
          restore-keys: pods-${{ runner.os }}-

      - name: pod install
        working-directory: ios
        run: pod install

      - name: Build Release (unsigned)
        run: |
          mkdir -p build
          WORKSPACE=$(ls -d ios/*.xcworkspace | head -n1)
          SCHEME=$(basename "$WORKSPACE" .xcworkspace)
          echo "workspace=$WORKSPACE scheme=$SCHEME"
          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            build > build/xcodebuild.log 2>&1 || {
              echo "::error::xcodebuild failed — first errors:"
              grep -n "error:" build/xcodebuild.log | head -40
              tail -80 build/xcodebuild.log
              exit 1
            }
          tail -5 build/xcodebuild.log

      - name: Package .ipa
        run: |
          APP=$(find build/DerivedData/Build/Products -maxdepth 2 -name '*.app' -type d | head -n1)
          echo "app=$APP"
          if [ ! -f "$APP/main.jsbundle" ]; then
            echo "::error::Release build has no embedded JS bundle"; exit 1
          fi
          mkdir -p build/Payload
          cp -R "$APP" build/Payload/
          (cd build && zip -qry FrameRemote.ipa Payload)
          ls -lh build/FrameRemote.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: FrameRemote-ipa
          path: build/FrameRemote.ipa
          retention-days: 30
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: xcodebuild-log
          path: build/xcodebuild.log
          retention-days: 7
